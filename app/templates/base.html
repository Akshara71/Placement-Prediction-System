<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Prediction System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <header class="site-header">
        <div class="header-inner">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-mark">PP</span>
                <span class="brand-name">Placement<span class="brand-accent">.</span>Predict</span>
            </a>
            <nav class="site-nav">
                <a href="{{ url_for('dataset') }}" class="nav-link">Dataset</a>
                <a href="{{ url_for('eda') }}" class="nav-link">EDA</a>
                <a href="#how-it-works" class="nav-link">How it works</a>
                <a href="#features" class="nav-link">Features</a>
            </nav>
            <a href="{{ url_for('predict') }}" class="btn btn-primary nav-cta">Run Prediction</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="brand-mark">PP</span>
                <span class="brand-name">Placement<span class="brand-accent">.</span>Predict</span>
                <p class="footer-tagline">A machine learning system for estimating campus placement outcomes.</p>
            </div>
            <div class="footer-meta">
                <span class="mono-tag">MACHINE LEARNING · CAPSTONE PROJECT</span>
                <span class="footer-copy">Built with Flask &amp; scikit-learn</span>
            </div>
        </div>
    </footer>

    <script>
        // Scroll-reveal: fade/slide elements in as they enter the viewport
        const revealEls = document.querySelectorAll('[data-reveal]');
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        revealEls.forEach(el => revealObserver.observe(el));

        // Animated count-up for stat numbers
        const counters = document.querySelectorAll('[data-count]');
        const countObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const el = entry.target;
                const target = parseFloat(el.dataset.count);
                const decimals = el.dataset.count.includes('.') ? 1 : 0;
                const duration = 1200;
                const start = performance.now();
                function tick(now) {
                    const progress = Math.min((now - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    el.textContent = (target * eased).toFixed(decimals);
                    if (progress < 1) requestAnimationFrame(tick);
                    else el.textContent = target.toFixed(decimals);
                }
                requestAnimationFrame(tick);
                countObserver.unobserve(el);
            });
        }, { threshold: 0.4 });
        counters.forEach(el => countObserver.observe(el));
    </script>

</body>
</html>
